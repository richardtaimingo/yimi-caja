<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tortura Biomecánica</title>
<meta name="description" content="Tu rutina de Classic Physique en dos toques: eliges el músculo, pulsas un botón y la app te guía serie por serie.">
<meta name="theme-color" content="#1e1b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tortura">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Unbounded:wght@600;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
if (window.tailwind) tailwind.config = {
  corePlugins: { preflight: false },
  theme: { extend: {
    colors: { tinta:'#1e1b3a', tinta2:'#2c2950', durazno:'#ffb27f', crema:'#ffe6cf', niebla:'#f3f2f8', gris:'#77748d' },
    fontFamily: { display:['Unbounded','system-ui','sans-serif'], sans:['Nunito','system-ui','sans-serif'] }
  } }
};
</script>
<style>
/* Diseño: tinta azul noche con goteos líquidos, papel blanco, durazno de acción y crema de resalte.
   Todo es una sola columna de teléfono (máx. 480 px), objetivos táctiles de 48 px o más y textos cortos. */
:root{
  --tinta:#1e1b3a; --tinta2:#2c2950; --papel:#ffffff; --niebla:#f3f2f8;
  --durazno:#ffb27f; --durazno2:#f7975a; --crema:#ffe6cf; --gris:#6f6c86; --rojo:#e5484d;
  --borde:2px solid var(--tinta); --r-lg:24px; --r-md:18px;
  --nav-h:74px; --seguro-ab:env(safe-area-inset-bottom,0px); --seguro-ar:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--tinta)}
body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;color:var(--tinta);background:var(--tinta);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--durazno2);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{display:block}
[hidden]{display:none!important}
.disp{font-family:Unbounded,Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.08}
.mini{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.suave{color:var(--gris)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Armazón de la app ---------- */
.app{position:relative;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--papel);overflow-x:clip}
@media (min-width:520px){.app{box-shadow:0 0 0 2px var(--tinta),0 30px 80px rgba(0,0,0,.45)}}
.vista{padding-bottom:calc(var(--nav-h) + var(--seguro-ab) + 96px);animation:entrar .28s ease both}
.vista.con-accion{padding-bottom:calc(var(--nav-h) + var(--seguro-ab) + 172px)}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding-left:16px;padding-right:16px}

/* ---------- Cabeceras de tinta con goteo ---------- */
.cab{background:var(--tinta);color:#fff;padding:calc(14px + var(--seguro-ar)) 16px 6px;position:relative}
.goteo{display:block;width:100%;height:auto;aspect-ratio:400/80;margin-top:-1px;pointer-events:none}
.goteo-sube{transform:scaleY(-1);margin-top:0;margin-bottom:-1px}
.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + var(--seguro-ar)) 16px 8px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:999px;border:var(--borde);font-weight:900;font-size:17px;letter-spacing:.01em;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn-durazno{background:var(--durazno);color:var(--tinta)}
.btn-durazno:active{background:var(--durazno2)}
.btn-tinta{background:var(--tinta);color:#fff}
.btn-blanco{background:#fff;color:var(--tinta)}
.btn-fantasma{background:transparent;color:#fff;border-color:rgba(255,255,255,.85)}
.btn-peligro{background:#fff;color:var(--rojo);border-color:var(--rojo)}
.btn-chico{min-height:44px;font-size:14.5px;padding:0 16px}
.btn-ancho{width:100%}
.btn-circ{width:56px;min-width:56px;padding:0}
.btn svg{width:22px;height:22px;flex-shrink:0}
.latir{animation:latir 1.1s ease-in-out infinite}
@keyframes latir{0%,100%{box-shadow:0 0 0 0 rgba(255,178,127,.9)}50%{box-shadow:0 0 0 10px rgba(255,178,127,0)}}

/* ---------- Filas tipo píldora (como “Встречи рядом с вами”) ---------- */
.fila{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 12px;border:var(--borde);border-radius:20px;background:#fff;text-align:left;transition:background .15s,transform .08s}
.fila:active{transform:scale(.985)}
.fila.sel{background:var(--durazno)}
.fila .t{font-weight:900;font-size:16.5px;line-height:1.2}
.fila .s{font-size:13px;color:var(--gris);line-height:1.25;margin-top:2px}
.fila.sel .s{color:var(--tinta)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ico svg{width:26px;height:26px}
.fila.sel .ico{background:#fff;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.chulo{width:34px;height:34px;border-radius:50%;border:var(--borde);display:grid;place-items:center;flex-shrink:0;font-weight:900;font-size:13px;background:#fff}
.fila.sel .chulo{background:var(--tinta);color:var(--durazno)}
.chulo svg{width:18px;height:18px}

/* ---------- Tarjetas y datos ---------- */
.tarjeta{border:var(--borde);border-radius:var(--r-lg);background:#fff;padding:16px}
.tarjeta.crema{background:var(--crema)}
.tarjeta.tinta{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.datos.dos{grid-template-columns:repeat(2,1fr)}
.dato{border:var(--borde);border-radius:16px;padding:9px 6px;text-align:center;background:#fff;min-width:0}
.dato b{display:block;font-size:18px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.dato span{display:block;font-size:12px;color:var(--gris);font-weight:700;margin-top:2px}
.etiqueta{display:inline-flex;align-items:center;gap:6px;border:var(--borde);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;background:#fff;white-space:nowrap}
.etiqueta.durazno{background:var(--durazno)}
.etiqueta.vacia{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
.paso-titulo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;margin:22px 0 10px}
.paso-titulo i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--tinta);color:var(--durazno);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.barra{height:12px;border-radius:999px;border:var(--borde);background:#fff;overflow:hidden}
.barra>span{display:block;height:100%;background:var(--durazno);transition:width .35s ease}
.cab .barra{border-color:#fff}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--crema);border:var(--borde);border-radius:16px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.35}
.aviso svg{width:22px;height:22px;flex-shrink:0;margin-top:1px}

/* ---------- Círculos de serie / días / pasos ---------- */
.series{display:flex;flex-wrap:wrap;gap:12px}
.serie{width:68px;height:68px;border-radius:50%;border:3px solid var(--tinta);background:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;transition:transform .1s,background .15s}
.serie:active{transform:scale(.9)}
.serie.hecha{background:var(--tinta);color:var(--durazno)}
.serie svg{width:30px;height:30px}
.pasos{display:flex;justify-content:space-between;gap:4px}
.paso{width:38px;height:38px;border-radius:50%;border:2px solid #fff;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.paso.hecho{background:#fff;color:var(--tinta)}
.paso.actual{background:var(--durazno);border-color:var(--durazno);color:var(--tinta);transform:scale(1.12)}
.paso svg{width:18px;height:18px}
.vacs{display:flex;gap:8px;flex-wrap:wrap}
.vac{width:48px;height:48px;border-radius:50%;border:var(--borde);background:#fff;font-weight:900;display:grid;place-items:center}
.vac.hecha{background:var(--tinta);color:var(--durazno)}
.vac svg{width:22px;height:22px}

/* ---------- Acordeón ---------- */
details.acord{border:var(--borde);border-radius:18px;background:#fff;overflow:hidden}
details.acord+details.acord{margin-top:10px}
details.acord>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;font-weight:900;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.acord>summary::-webkit-details-marker{display:none}
details.acord>summary .flecha{margin-left:auto;transition:transform .2s;width:22px;height:22px;flex-shrink:0}
details.acord[open]>summary .flecha{transform:rotate(90deg)}
details.acord>summary .ico{width:34px;height:34px}
details.acord>summary .ico svg{width:19px;height:19px}
details.acord .cuerpo{padding:0 14px 14px;font-size:15.5px;line-height:1.55}
details.acord.crema{background:var(--crema)}

/* ---------- Barra de acción fija (Anterior / Siguiente) ---------- */
.accion{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(var(--nav-h) + var(--seguro-ab));padding:12px 16px 12px;display:flex;gap:10px;background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0));z-index:30}
.accion .btn{flex:1}
.accion .btn-circ{flex:0 0 56px}

/* ---------- Barra de pestañas ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:40;background:var(--tinta);border-radius:26px 26px 0 0;padding:8px 6px calc(8px + var(--seguro-ab));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:#b9b6d3;font-size:11.5px;font-weight:800;position:relative}
.tab svg{width:25px;height:25px}
.tab.activa{color:#fff}
.tab.activa svg{color:var(--durazno)}
.tab.activa::after{content:"";position:absolute;bottom:-4px;width:6px;height:6px;border-radius:50%;background:var(--durazno)}
.tab-centro .bola{width:62px;height:62px;margin-top:-30px;border-radius:50%;background:var(--durazno);border:3px solid var(--tinta);box-shadow:0 0 0 4px #fff;display:grid;place-items:center;color:var(--tinta)}
.tab-centro .bola svg{width:30px;height:30px}
.tab-centro.activa::after{display:none}
.tab-centro.corriendo .bola{animation:latir 1.1s ease-in-out infinite}

/* ---------- Píldora del reloj en marcha ---------- */
.pildora{position:fixed;z-index:35;right:max(16px,calc(50% - 224px));bottom:calc(var(--nav-h) + var(--seguro-ab) + 14px);display:flex;align-items:center;gap:8px;background:var(--tinta);color:#fff;border:2px solid var(--durazno);border-radius:999px;padding:8px 14px 8px 10px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 10px 26px rgba(30,27,58,.35)}
.pildora svg{width:22px;height:22px;color:var(--durazno)}
.pildora small{font-size:11px;font-weight:800;color:#c9c6e2;display:block;line-height:1}
.chip-reloj{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:56px;padding:0 12px 0 10px;border-radius:999px;background:var(--tinta);color:#fff;border:2px solid var(--durazno);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;text-align:left}
.chip-reloj svg{width:22px;height:22px;color:var(--durazno)}
.chip-reloj small{display:block;font-size:10.5px;font-weight:800;color:#c9c6e2;line-height:1}
.con-accion-visible .pildora{bottom:calc(var(--nav-h) + var(--seguro-ab) + 90px)}

/* ---------- Hojas inferiores, diálogos y alarmas ---------- */
.fondo-hoja{position:fixed;inset:0;z-index:60;background:rgba(20,18,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:aparecer .2s ease both}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.hoja{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;border:var(--borde);border-bottom:0;padding:10px 16px calc(18px + var(--seguro-ab));animation:subir .26s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
.asa{width:46px;height:5px;border-radius:9px;background:#cfcde0;margin:0 auto 10px}
.anillo{position:relative;width:min(230px,62vw);aspect-ratio:1;margin:6px auto 4px}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anillo .num b{font-family:Unbounded,Nunito,sans-serif;font-size:clamp(40px,13vw,54px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{min-height:58px;border:var(--borde);border-radius:18px;background:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.preset small{font-size:10.5px;font-weight:800;color:var(--gris);margin-top:2px}
.preset.esp{background:var(--crema)}
.preset:active{background:var(--durazno)}
.alarma{position:fixed;inset:0;z-index:90;background:var(--tinta);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;animation:alarma .5s ease-in-out infinite alternate}
@keyframes alarma{from{background:var(--tinta)}to{background:#2f2a5c}}
.alarma .gran{font-family:Unbounded,Nunito,sans-serif;font-weight:800;font-size:clamp(56px,20vw,92px);color:var(--durazno);line-height:.95}
.alarma .goteo{position:absolute;top:0;left:0;right:0}
.dialogo{position:fixed;inset:0;z-index:95;background:rgba(20,18,40,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
.dialogo .hoja{border-bottom:0}
.toast{position:fixed;left:50%;top:calc(12px + var(--seguro-ar));transform:translate(-50%,-160%);z-index:99;background:var(--tinta);color:#fff;border:2px solid var(--durazno);border-radius:999px;padding:10px 18px;font-weight:800;font-size:15px;transition:transform .3s ease;max-width:calc(100% - 32px);text-align:center}
.toast.ver{transform:translate(-50%,0)}

/* ---------- Bienvenida (onboarding) ---------- */
.intro{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:calc(12px + var(--seguro-ar)) 20px calc(22px + var(--seguro-ab))}
.intro .saltar{align-self:flex-end;font-weight:800;color:var(--gris);min-height:44px;padding:0 6px}
.intro .ilus{flex:1;display:grid;place-items:center;min-height:0}
.intro .ilus svg{width:min(300px,78vw);height:auto}
.intro h2{font-size:clamp(24px,7.4vw,30px);font-weight:900;line-height:1.12}
.intro h2 b{font-family:Unbounded,Nunito,sans-serif;font-weight:900;text-transform:uppercase}
.puntos{display:flex;gap:8px}
.puntos i{width:9px;height:9px;border-radius:50%;background:#d4d2e2}
.puntos i.on{background:var(--tinta);width:24px;border-radius:9px}
.btn-sig{width:76px;height:76px;border-radius:50%;background:var(--durazno);border:var(--borde);font-weight:900;font-size:13px;display:grid;place-items:center}

/* ---------- Calendario ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--borde);border-radius:999px;padding:3px;background:#fff}
.seg button{min-height:44px;border-radius:999px;font-weight:900;font-size:15px;color:var(--tinta)}
.seg button.on{background:var(--tinta);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dsem{font-size:12px;font-weight:800;color:var(--gris)}
.dia{aspect-ratio:1;border-radius:50%;border:2px solid var(--tinta);background:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;max-width:46px;width:100%;margin:0 auto}
.dia.vacio{border-color:transparent;background:transparent}
.dia.fuera{border-color:#d9d7e6;color:#a3a1b6}
.dia.entreno{background:var(--durazno)}
.dia.completo{background:var(--tinta);color:var(--durazno)}
.dia.hoy{box-shadow:0 0 0 3px var(--durazno2)}
.dia.sel{outline:3px solid var(--tinta);outline-offset:2px}

/* ---------- Varios ---------- */
.interruptor{position:relative;width:58px;height:34px;border-radius:999px;border:var(--borde);background:#fff;flex-shrink:0;transition:background .15s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--tinta);transition:transform .18s}
.interruptor[aria-checked="true"]{background:var(--durazno)}
.interruptor[aria-checked="true"]::after{transform:translateX(24px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{flex:1;min-width:0;height:56px;border:var(--borde);border-radius:18px;text-align:center;font-weight:900;font-size:24px;background:#fff}
.lista-poses .pose{border-top:2px dashed #d5d3e3;padding:14px 0}
.lista-poses .pose:first-child{border-top:0;padding-top:4px}
.dia.generado{border-style:dashed;border-color:#a9a6c0}
.fila>svg{width:22px;height:22px;flex-shrink:0}
.ilus-svg{display:block;width:min(260px,70vw);height:auto;margin:0 auto}
.gota{display:inline-block;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--tinta)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.serie{width:60px;height:60px;font-size:20px}.paso{width:33px;height:33px;font-size:13px}.btn{font-size:16px}.presets{grid-template-columns:repeat(4,1fr);gap:6px}.preset{font-size:15px}}
</style>
</head>
<body>
<div class="app" id="app">
  <main>
    <section id="v-inicio" class="vista" data-vista="inicio" aria-label="Inicio"></section>
    <section id="v-entreno" class="vista" data-vista="entreno" aria-label="Entreno" hidden></section>
    <section id="v-historial" class="vista" data-vista="historial" aria-label="Historial" hidden></section>
    <section id="v-perfil" class="vista" data-vista="perfil" aria-label="Perfil" hidden></section>
  </main>

  <div id="accion" class="accion" hidden></div>

  <button id="pildora" class="pildora" data-acc="abrirReloj" hidden aria-label="Abrir cronómetro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M9.5 2.5h5M12 2.5V6"/></svg>
    <span><small id="pildoraEtq">Descanso</small><span id="pildoraTxt">00:00</span></span>
  </button>

  <nav class="nav" aria-label="Menú principal">
    <button class="tab activa" data-ir="inicio" aria-label="Inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>Inicio
    </button>
    <button class="tab" data-ir="entreno" aria-label="Entreno">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Entreno
    </button>
    <button class="tab tab-centro" id="tabReloj" data-acc="abrirReloj" aria-label="Cronómetro">
      <span class="bola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M9.5 2.5h5M12 2.5V6M18.5 6.5l1.5-1.5"/></svg></span>Reloj

<script>
'use strict';
const BANCO = {};

/* ---------------------------- GEMELOS ---------------------------- */
BANCO.gemelos = [
  { id:'gem01', n:'Gemelos de pie en Hack Squat (puntas en el borde)', eq:'Hack Squat', t:['maquina','aislado','gemelo'], r:'10-14',
    tor:'Mete los hombros bajo las almohadillas, puntas de los pies en el último centímetro de la plataforma y rodillas bloqueadas sin hiperextender. Baja el talón hasta que sientas el tendón de Aquiles a punto de reventar y CONGELA 3 segundos: sin rebote, el tendón se desactiva y el gemelo carga todo solo. Explota hacia arriba sobre el dedo gordo y estrújalo 2 segundos como si quisieras romper la plataforma. Cuando ya no subas completo, haz parciales en la mitad baja hasta que tiemble la pierna entera.',
    cue:'Peso sobre el 1er y 2º metatarsiano: evita que el tobillo se vaya hacia afuera y entrena la cabeza interna que llena la pantorrilla de frente.', ref:{b:'hack',p:[0.55,0.7]} },
  { id:'gem02', n:'Gemelos en Prensa con pausa muerta', eq:'Prensa', t:['maquina','aislado','gemelo'], r:'12-15',
    tor:'Rodillas extendidas pero vivas, solo la bola del pie sobre el borde inferior de la plataforma. Deja que el peso te empuje el tobillo a la máxima dorsiflexión y cuenta 3 segundos inmóvil abajo. Empuja con los dedos gordos, llega al tope y contrae 2 segundos. Cero rebote, cero trampa con la rodilla: si doblas la rodilla, la serie se cuenta en cero. Tu gemelo debe arder antes de la repetición 8.',
    cue:'Fémures largos = tendón largo y gemelo alto: la pausa abajo es lo único que obliga al vientre muscular a trabajar en toda su longitud.', ref:{b:'pendulo',p:[1.2,1.6]} },
  { id:'gem03', n:'Gemelos de pie en Smith sobre step', eq:'Máquina Smith + step', t:['smith','aislado','gemelo'], r:'10-12',
    tor:'Barra de la Smith sobre los trapecios, metatarsos sobre un step o disco grueso. Baja hasta el fondo absoluto y aguanta 3 segundos sin respirar. Sube sin doblar las rodillas, quédate 2 segundos en la punta como bailarina y aprieta como si quisieras partir el step. La Smith elimina el equilibrio: toda tu energía va al músculo. Si no sientes calambre en la serie 2, estás haciendo turismo.',
    cue:'Coloca el step para que el talón tenga mínimo 8–10 cm de recorrido libre: rango completo o nada.', ref:{b:'pm',p:[0.7,0.9]} },
  { id:'gem04', n:'Gemelo Burro en Smith (cadera flexionada)', eq:'Máquina Smith', t:['smith','aislado','gemelo'], r:'12-15',
    tor:'Inclínate 90° con las manos apoyadas en un banco y la barra de la Smith sobre la zona baja de la espalda y la cadera (con almohadilla). Con la cadera flexionada el gemelo queda pre-estirado desde arriba: es la posición de máximo daño. Baja el talón, pausa muerta de 3 segundos, sube y contrae 2. Sentirás que el gemelo se abre en dos. Ahí es donde crece.',
    cue:'El burro es el único ejercicio que estira el gemelo desde ambos extremos: perfecto para un atleta de piernas largas con gemelo de inserción alta.', ref:{b:'pm',p:[0.5,0.7]} },
  { id:'gem05', n:'Gemelos en Sentadilla Péndulo', eq:'Sentadilla Péndulo', t:['maquina','aislado','gemelo'], r:'10-14',
    tor:'Ponte en la péndulo con las piernas rectas y solo las puntas en el borde de la plataforma. El arco de la máquina te da una resistencia que no afloja en la posición estirada. Baja a fondo, 3 segundos muertos, sube y retén 2 segundos arriba con los glúteos apretados para no hacer trampa con la cadera. Cada repetición debe ser idéntica a la primera: ni un milímetro de rebote.',
    cue:'Mantén las rodillas bloqueadas en suave: si las doblas el sóleo roba el trabajo y el gemelo no se llena.', ref:{b:'pendulo',p:[0.6,0.8]} },
  { id:'gem06', n:'Sóleo sentado en Smith (rodillas a 90°)', eq:'Máquina Smith + banco + step', t:['smith','aislado','gemelo'], r:'15-20',
    tor:'Siéntate en un banco bajo la Smith, la barra sobre los muslos cerca de las rodillas con una toalla doblada, puntas sobre un step. Con la rodilla a 90° el gemelo se apaga y el sóleo carga todo: es el músculo que ensancha la pantorrilla vista de frente. Baja 3 segundos muertos, sube y retén 2. El sóleo es de fibra lenta: castígalo con volumen y ardor, no te detengas hasta que la quemazón sea insoportable.',
    cue:'Un sóleo grande empuja el gemelo hacia afuera y hace que la pantorrilla se vea más gruesa en el cuarto de giro.', ref:{b:'pm',p:[0.45,0.65]} },
  { id:'gem07', n:'Gemelo unilateral con mancuerna en step', eq:'Mancuerna pesada + step', t:['mancuerna','aislado','gemelo','unilateral'], r:'10-12 por pierna',
    tor:'Una mano sujeta un rack, la otra la mancuerna más pesada que puedas controlar. Una sola pierna sobre el step, la otra cruzada detrás. Baja al fondo, 3 segundos muertos, sube y contrae 2 segundos con todo el peso del cuerpo sobre el dedo gordo. Al trabajar una pierna a la vez tu pantorrilla débil no se puede esconder detrás de la fuerte.',
    cue:'Empieza siempre con la pantorrilla más pequeña y dale a la otra exactamente las mismas repeticiones: simetría de tarima.' },
  { id:'gem08', n:'Gemelos en Prensa unilateral', eq:'Prensa', t:['maquina','aislado','gemelo','unilateral'], r:'10-12 por pierna',
    tor:'Una sola pierna en el borde de la plataforma, la otra fuera. Con la mitad de carga obtienes el doble de tensión por fibra. Dorsiflexión total, 3 segundos de pausa sin moverte, empuje explosivo con el dedo gordo y 2 segundos de contracción. Termina cada pierna con 10 parciales en el tercio inferior. Cambia de pierna sin descanso.',
    cue:'Mira la rodilla: si se desvía hacia afuera estás empujando con el meñique. Corrige o la pantorrilla crecerá torcida.', ref:{b:'pendulo',p:[0.6,0.8]} }
];

/* ----------------------- FEMORAL (FLEXIÓN DE RODILLA) ----------------------- */
BANCO.femoral = [
  { id:'fem01', n:'Curl femoral acostado con pausa en estiramiento', eq:'Máquina de curl acostado / polea', t:['maquina','aislado'], r:'8-10',
    tor:'Cadera clavada contra el banco, empuja el pubis hacia el acolchado para que la cadera no se levante. Flexiona hasta que el talón casi toque el glúteo, aprieta 1 segundo y baja en 4 segundos hasta la extensión casi completa, donde te quedas 2 segundos en estiramiento antes de volver a subir. Cuando falles, que un compañero te ayude con 2 forzadas y aguanta tú solo la negativa.',
    cue:'Puntas de los pies hacia el piso (flexión plantar) para apagar el gemelo y obligar al isquio a trabajar solo.' },
  { id:'fem02', n:'Curl femoral sentado con torso inclinado hacia adelante', eq:'Máquina de curl sentado', t:['maquina','aislado'], r:'8-12',
    tor:'Ajusta el respaldo lo más atrás posible y luego inclina el torso hacia adelante con la espalda recta: flexionar la cadera estira el isquio desde arriba. Este es el curl que más crece el femoral según la evidencia moderna. Tira hasta el fondo, aprieta 1 segundo, sube en 4 segundos y quédate 2 segundos en la posición más estirada. El femoral va a sentirse como un cable a punto de romperse.',
    cue:'Este estiramiento lastrado es lo que crea el "cuelgue" del femoral visible de perfil en el side chest.' },
  { id:'fem03', n:'Curl femoral unilateral de pie en polea', eq:'Polea baja + tobillera', t:['polea','aislado','unilateral'], r:'10-12 por pierna',
    tor:'Tobillera en la polea baja, de cara a la máquina, sujétate y adelanta ligeramente la cadera. Flexiona la rodilla llevando el talón al glúteo sin mover el muslo, aprieta 2 segundos y baja en 4 segundos hasta que la pierna quede totalmente estirada. La polea no te da descanso en ningún punto. Sin pausa entre piernas: cuando termina una, empieza la otra.',
    cue:'Inclina un poco el torso hacia adelante para alargar el isquio y que trabaje en mayor rango.' },
  { id:'fem04', n:'Curl nórdico excéntrico asistido en polea', eq:'Polea alta + cojín de Hip Thrust', t:['peso_corporal','aislado'], r:'5-8',
    tor:'Arrodíllate sobre el cojín con los talones anclados bajo algo pesado; agarra un estribo de la polea alta tras de ti como contrapeso. Desciende el torso hacia el piso en 6 a 8 segundos resistiendo SOLO con los isquios, cadera extendida, como una tabla. Cuando ya no puedas frenar, déjate caer sobre las manos y empuja para volver. Cada repetición es un desgarro controlado de fibras.',
    cue:'Es el mejor protector de rodilla para fémures largos: el isquio fuerte excéntricamente estabiliza la Hack profunda.' },
  { id:'fem05', n:'Curl femoral sentado unilateral', eq:'Máquina de curl sentado', t:['maquina','aislado','unilateral'], r:'10-12 por pierna',
    tor:'Una sola pierna en la máquina, torso inclinado hacia adelante. Tira hasta el fondo con el talón buscando el asiento, retén 2 segundos, sube en 4 segundos. La pierna que no trabaja descansa en el suelo: nada de ayudas. Al terminar la serie, sin descanso, 10 parciales en el tercio estirado.',
    cue:'Unilateral corrige el desequilibrio izquierda-derecha que los jueces ven al instante en el rear double biceps.' },
  { id:'fem06', n:'Curl femoral acostado con mancuerna entre los pies', eq:'Banco plano + mancuerna', t:['mancuerna','aislado'], r:'10-12',
    tor:'Acuéstate boca abajo en un banco plano con las rodillas en el borde y una mancuerna atrapada entre los pies. Flexiona hasta que la mancuerna quede vertical, sin pasar de ahí, y baja en 5 segundos hasta casi extender. Se pierde tensión arriba, así que el trabajo vive abajo: haz que cada centímetro del estiramiento cuente.',
    cue:'Aprieta la cadera contra el banco: si se levanta, el glúteo y la lumbar roban la repetición.' }
];

/* --------------- BISAGRA DE CADERA (CADENA POSTERIOR SIN LUMBAR) --------------- */
BANCO.bisagra = [
  { id:'bis01', n:'Rumano B-Stance en Smith con straps', eq:'Máquina Smith + straps', t:['smith','compuesto','unilateral'], r:'8-10 por pierna',
    tor:'Straps puestos. Pie de trabajo plano bajo la barra, el otro un paso atrás solo con la punta apoyada como "pata de cabra". Empuja la cadera hacia atrás con la columna neutra, barra pegada al muslo, hasta que el isquio de la pierna de apoyo grite. Sube SOLO hasta el 90%: no bloquees arriba, el músculo nunca descansa. La Smith te deja enfocarte en estirar sin pensar en el equilibrio.',
    cue:'Lumbar neutra y tirando con el femoral, no con la espalda: así entrenas el cuelgue sin engrosar oblicuos ni erectores.', ref:{b:'pm',p:[0.45,0.6]} },
  { id:'bis02', n:'Buenos Días en Hack Invertida', eq:'Hack Squat (de frente a la máquina)', t:['maquina','compuesto'], r:'8-10',
    tor:'Colócate de frente al respaldo de la Hack con las almohadillas sobre los hombros y el pecho apoyado. Rodillas suavemente flexionadas y fijas. Empuja la cadera hacia atrás y deja que el torso baje hasta que los isquios estén al límite, luego sube con los glúteos. La máquina guía el recorrido y la espalda queda protegida: toda la carga cae en la cadera. No bloquees arriba.',
    cue:'Uno de los mejores ejercicios de bisagra que existen para torsos largos: carga máxima en el femoral con cero compresión axial.', ref:{b:'hack',p:[0.35,0.5]} },
  { id:'bis03', n:'Rumano con mancuernas y straps (sin bloquear)', eq:'Mancuernas pesadas + straps', t:['mancuerna','compuesto'], r:'8-12',
    tor:'Straps apretados para que el agarre no limite la serie. Mancuernas pegadas a los muslos, empuja la cadera hacia atrás como si cerraras una puerta con los glúteos. Baja hasta media espinilla o hasta que la columna empiece a redondearse: ese es tu límite. Pausa 1 segundo en el estiramiento y sube hasta 3/4: nunca bloquees arriba ni eches los hombros hacia atrás.',
    cue:'Las mancuernas a los lados permiten que el centro de masa quede cerca: menos palanca lumbar que con barra.', ref:{b:'pm',p:[0.4,0.5]} },
  { id:'bis04', n:'Rumano en Smith con déficit y straps', eq:'Máquina Smith + disco o step', t:['smith','compuesto'], r:'6-10',
    tor:'Párate sobre un disco de 20 kg bajo la Smith. El déficit te da 5–8 cm extra de estiramiento: el femoral pasará a un rango que no conocía. Straps, barra pegada a las piernas, cadera atrás, columna intacta. Baja en 4 segundos, pausa 2 abajo y sube con fuerza hasta el 90%. Los isquios van a amanecer destruidos dos días.',
    cue:'Solo baja hasta donde la pelvis siga rotando: si la columna se redondea, terminaste la repetición.', ref:{b:'pm',p:[0.5,0.65]} },
  { id:'bis05', n:'Hiperextensión 45° sesgada a femoral (espalda neutra, sin lumbar)', eq:'Banco de hiperextensión 45° + mancuerna', t:['peso_corporal','compuesto'], r:'12-15',
    tor:'Almohadilla bajo los huesos de la cadera (no en el abdomen) para que la bisagra suceda en la cadera. Pies separados y puntas ligeramente afuera. Abraza una mancuerna al pecho, baja con la columna rígida y sube con glúteos e isquios SOLO hasta que el cuerpo quede alineado: nada de hiperextender la lumbar arriba. Pausa de 2 segundos abajo en cada repetición.',
    cue:'Si sientes la lumbar, sube la almohadilla. La meta es glúteo-femoral, no erectores gruesos.' },
  { id:'bis06', n:'Rumano unilateral Kickstand con mancuerna', eq:'Mancuerna pesada + straps', t:['mancuerna','compuesto','unilateral'], r:'10 por pierna',
    tor:'Mancuerna en la mano contraria a la pierna de trabajo, la otra pierna atrás solo apoyada como soporte. La cadera de trabajo se va hacia atrás y la mancuerna desciende por la parte interna de la pierna. Siente cómo el femoral y la cara interna del glúteo se estiran como una banda. Sube contrayendo el glúteo sin girar la pelvis y nunca bloquees arriba.',
    cue:'Llevar el peso al lado contrario activa el glúteo medio: estabiliza la rodilla y refuerza el contorno lateral de la cadera.' },
  { id:'bis07', n:'Pull-Through en polea con cuerda', eq:'Polea baja + cuerda', t:['polea','compuesto'], r:'12-15',
    tor:'De espaldas a la polea baja, cuerda entre las piernas, pies anchos. Deja que la polea te jale las manos hacia atrás mientras la cadera retrocede y el torso baja. Cuando los isquios estén al máximo, explota los glúteos hacia adelante y aprieta 2 segundos arriba como si partieras una nuez. La polea no te deja descansar en ningún punto del recorrido.',
    cue:'Cero compresión espinal: es bisagra pura para atletas que quieren cintura pequeña.' }
];

/* --------------------------- GLÚTEO --------------------------- */
BANCO.gluteo = [
  { id:'glu01', n:'Hip Thrust en Smith con cojín y pausa de 2 s', eq:'Máquina Smith + cojín de Hip Thrust + banco', t:['smith','compuesto'], r:'8-12',
    tor:'Escápulas sobre el borde del banco, barra de la Smith sobre la cadera con el cojín. Pies a la altura donde las espinillas queden verticales arriba. Sube con retroversión pélvica: costillas abajo, mentón al pecho, y aprieta los glúteos 2 segundos como si quisieras doblar la barra. Baja hasta que el glúteo apenas toque el piso y vuelve a subir. Si arquea la lumbar, la repetición no existe.',
    cue:'La retroversión pélvica arriba es lo que dibuja las estrías del glúteo en el rear lat spread.', ref:{b:'pm',p:[0.8,1.1]} },
  { id:'glu02', n:'Kneeling Squat en Smith', eq:'Máquina Smith + cojín', t:['smith','compuesto'], r:'8-12',
    tor:'Arrodíllate sobre el cojín bajo la Smith, barra sobre los trapecios. Siéntate sobre los talones llevando la cadera atrás y explota hacia adelante con los glúteos hasta quedar erguido. El recorrido es corto pero brutal: toda la extensión de cadera, cero cuádriceps. Aprieta 2 segundos arriba con la pelvis en retroversión.',
    cue:'Carga lo que quieras: aquí no hay estrés en la rodilla ni en la lumbar si mantienes las costillas abajo.', ref:{b:'pm',p:[0.6,0.85]} },
  { id:'glu03', n:'Patada de glúteo en polea a 45°', eq:'Polea baja + tobillera', t:['polea','aislado','unilateral'], r:'12-15 por pierna',
    tor:'Tobillera puesta, inclínate hacia adelante sujetándote. Lleva la pierna hacia atrás y hacia afuera a 45°, rodilla ligeramente flexionada, sin arquear la lumbar. Contrae 2 segundos arriba y regresa lento hasta que la pierna cruce por delante de la de apoyo. El glúteo superior y medio se encargan del "ancho" de la cadera de perfil.',
    cue:'El vector a 45° trabaja glúteo mayor superior y medio: redondez lateral sin agrandar la cintura.' },
  { id:'glu04', n:'Abducción en polea de pie inclinado', eq:'Polea baja + tobillera', t:['polea','aislado','unilateral'], r:'15-20 por pierna',
    tor:'De lado a la polea, tobillera en la pierna lejana, inclínate ligeramente hacia adelante. Separa la pierna hacia afuera y un poco hacia atrás hasta sentir que el glúteo medio quema como ácido. Aguanta 1 segundo y regresa cruzando por delante para un estiramiento máximo. Al fallar, 10 parciales en la parte alta.',
    cue:'Glúteo medio desarrollado = cadera que acompaña la línea de la X sin perder la cintura.' },
  { id:'glu05', n:'Zancada inversa con déficit en Smith (sesgo glúteo)', eq:'Máquina Smith + step', t:['smith','compuesto','unilateral'], r:'8-10 por pierna',
    tor:'Pie de trabajo sobre un step de 10 cm bajo la Smith. Da un paso largo hacia atrás e inclina el torso 20° hacia adelante: así el glúteo se lleva la carga. Baja hasta que la rodilla de atrás casi toque el piso y el glúteo esté estirado al límite. Empuja con el talón del pie de adelante. La rodilla de trabajo debe seguir la línea del pie: cero valgo.',
    cue:'El déficit agrega rango de flexión de cadera: es la palanca ideal para fémures largos.', ref:{b:'pm',p:[0.35,0.5]} },
  { id:'glu06', n:'Hip Thrust unilateral con mancuerna', eq:'Banco + mancuerna pesada', t:['mancuerna','compuesto','unilateral'], r:'10-12 por pierna',
    tor:'Escápulas en el banco, mancuerna sobre la cadera del lado de trabajo, la otra pierna en el aire. Empuja con el talón y aprieta el glúteo 3 segundos arriba. Baja controlado y no toques el piso. El lado débil se expone al instante: trabájalo primero y dale a la otra pierna las mismas repeticiones.',
    cue:'Sin rotar la pelvis: si la cadera libre cae, el glúteo medio se rinde y la serie terminó.' },
  { id:'glu07', n:'Abducción sentado inclinado hacia adelante', eq:'Máquina abductora', t:['maquina','aislado'], r:'15-20',
    tor:'Siéntate en la abductora e inclina el torso hacia adelante sujetándote de la máquina: así el glúteo superior hace el trabajo. Abre hasta el máximo, aguanta 2 segundos y cierra en 3 segundos. Al fallar, abre lo que puedas en parciales hasta que el glúteo arda como fuego.',
    cue:'Inclinado hacia adelante sesga glúteo mayor superior; erguido sesga glúteo medio. Aquí buscamos el primero.' }
];

/* ----------------------- CUÁDRICEPS COMPUESTOS ----------------------- */
BANCO.cuadComp = [
  { id:'cua01', n:'Hack Squat profunda (isquio sobre pantorrilla)', eq:'Hack Squat', t:['maquina','compuesto'], r:'6-10',
    tor:'Pies a la anchura de la cadera en la mitad de la plataforma, espalda pegada al respaldo. Baja en 4 segundos hasta que el isquiotibial APLASTE la pantorrilla: ese es el 100% del rango. Las rodillas viajan por encima del 2º-3er dedo del pie, jamás hacia adentro. Pausa 1 segundo abajo sin rebotar y empuja con todo el pie. Sube hasta el 90%, nunca bloquees.',
    cue:'Fémures largos exigen que las rodillas pasen la punta del pie: la Hack lo permite sin cargar la lumbar.', ref:{b:'hack',p:[0.6,0.75]} },
  { id:'cua02', n:'Sentadilla Péndulo profunda', eq:'Sentadilla Péndulo', t:['maquina','compuesto'], r:'8-12',
    tor:'Pies juntos-medios en la parte media de la plataforma. Desciende en 4 segundos con el torso pegado al respaldo hasta que los glúteos casi toquen los talones. El arco de la péndulo mantiene la tensión en el cuádriceps en la parte más profunda. Sin rebote, con pausa abajo. Empuja con todo el pie hasta el 90%. Rodillas alineadas con los pies en TODA la repetición.',
    cue:'La resistencia de la péndulo aumenta abajo: es el estímulo perfecto para el vasto medial y el lateral.', ref:{b:'pendulo',p:[0.7,0.9]} },
  { id:'cua03', n:'Prensa 3 Posiciones 10-10-10', eq:'Prensa', t:['maquina','compuesto'], r:'10+10+10',
    tor:'Sin soltar ni descansar: 10 repeticiones con los pies abajo y juntos (vasto lateral), 10 con los pies a la anchura de la cadera en el centro (todo el cuádriceps) y 10 con los pies altos y anchos (aductores y glúteo). 30 repeticiones seguidas en profundidad total. Si no llegas a 30, cada repetición que falte la terminas en parciales. Tus piernas van a temblar al bajarte de la máquina.',
    cue:'Profundidad total pero lumbar pegada al respaldo: si la pelvis se despega, has bajado demasiado.', ref:{b:'hack',p:[1.0,1.3]} },
  { id:'cua04', n:'Sentadilla en Smith con pies adelantados y talones elevados', eq:'Máquina Smith + cuña', t:['smith','compuesto'], r:'8-12',
    tor:'Pies 20–30 cm adelante de la barra con los talones sobre una cuña o disco. Baja con el torso erguido hasta que los isquios toquen las pantorrillas. Los talones elevados permiten que la rodilla avance más y el cuádriceps se estire a tope. Pausa 1 segundo abajo y sube sin bloquear. Mantén las rodillas apuntando hacia afuera, siguiendo los pies.',
    cue:'Para fémur largo esta posición mantiene el torso erguido sin cargar la lumbar: cuádriceps puro.', ref:{b:'pm',p:[0.55,0.75]} },
  { id:'cua05', n:'Sentadilla Búlgara en Smith (sesgo cuádriceps)', eq:'Máquina Smith + banco', t:['smith','compuesto','unilateral'], r:'8-10 por pierna',
    tor:'Pie trasero sobre el banco, pie delantero adelantado lo suficiente para que la rodilla pase la punta del pie. Torso erguido. Baja hasta que el glúteo casi toque el talón delantero y el cuádriceps esté al máximo de estiramiento. Sube empujando con el antepié. Cero valgo: la rodilla en la línea del 2º dedo.',

  { id:'dpr02', n:'Press con mancuernas sentado agarre neutro', eq:'Mancuernas pesadas + banco', t:['mancuerna','compuesto'], r:'8-10',
    tor:'Sentado con respaldo, agarre neutro y codos ligeramente adelante del torso. Baja las mancuernas hasta que estén a la altura de las orejas y sientas el deltoide estirarse. Empuja hasta 3/4 sin chocar las mancuernas arriba y vuelve a bajar en 3 segundos. Costillas abajo y glúteos en el asiento: si arqueas, el pecho se lleva el trabajo y la lumbar paga la factura.',
    cue:'El agarre neutro protege el manguito rotador y permite más rango que la barra: hombro sano para seguir entrenando pesado hasta la tarima.' },
  { id:'dpr03', n:'Landmine Press de pie', eq:'Barra en landmine', t:['barra','compuesto','unilateral'], r:'10 por lado',
    tor:'De pie, postura escalonada, la barra del landmine apoyada en el hombro. Empuja hacia arriba y hacia adelante siguiendo el arco natural de la barra hasta extender casi por completo. Aprieta 1 segundo y baja en 3 segundos hasta el hombro. Glúteos y abdomen apretados como bloque: cero inclinación del torso, cero trampa.',
    cue:'El arco del landmine respeta la articulación del hombro: carga pesada en deltoide anterior y lateral sin pinzamiento.' },
  { id:'dpr04', n:'Press Arnold Poliquin', eq:'Mancuernas + banco', t:['mancuerna','compuesto'], r:'8-10',
    tor:'Sentado con respaldo, mancuernas frente al rostro con las palmas hacia ti. Al subir, rota las palmas hacia afuera y abre los codos hasta terminar en press normal. Baja invirtiendo el giro y vuelve a la posición inicial. Versión Poliquin: tempo 4-0-1-0, cuatro segundos bajando. La rotación hace que el deltoide trabaje en todo su abanico.',
    cue:'El giro recluta deltoide anterior y lateral en un solo movimiento: hombros llenos de frente y de lado.' },
  { id:'dpr05', n:'Pin Press en Smith desde la barbilla', eq:'Máquina Smith + banco', t:['smith','compuesto'], r:'6-8',
    tor:'Banco a 80° bajo la Smith con los pines a la altura de la barbilla. Cada repetición arranca MUERTA desde los pines: sin reflejo elástico, el deltoide tiene que generar la fuerza desde cero. Empuja explosivo hasta 3/4, baja en 3 segundos y deja que la barra repose medio segundo en los pines antes de volver a empujar. Esto es fuerza bruta de hombro, sin trucos.',
    cue:'El arranque muerto elimina el rebote y obliga al deltoide a producir tensión máxima en su punto más débil.' },
  { id:'dpr06', n:'Press Meadows sentado con mancuernas', eq:'Mancuernas + banco', t:['mancuerna','compuesto'], r:'10-12',
    tor:'Sentado con respaldo, agarre semi-neutro con las mancuernas un poco por delante de los hombros. Baja más profundo que en un press normal, hasta que el deltoide esté estirado, pausa 1 segundo y empuja hasta 3/4. Cuando falles, quédate en la mitad baja del recorrido y haz parciales hasta que no puedas despegar las mancuernas de los hombros. Sin piedad.',
    cue:'Rango profundo y parciales en estiramiento: el método Meadows para hombros que se ven redondos desde cualquier ángulo.' }
];

/* ----------------------- DELTOIDE LATERAL ----------------------- */
BANCO.deltLat = [
  { id:'dla01', n:'Elevación lateral en polea a la altura de la muñeca (por detrás)', eq:'Polea ajustable', t:['polea','aislado','unilateral'], r:'12-15 por lado',

    cue:'Volumen extremo con tensión continua: inunda de sangre el deltoide lateral y maximiza la estrés metabólico.' },
  { id:'dla05', n:'Elevación lateral en banco inclinado (de lado)', eq:'Mancuerna + banco inclinado', t:['mancuerna','aislado','unilateral'], r:'12-15 por lado',
    tor:'Acostado de lado sobre un banco inclinado a 45°. Desde abajo, sube la mancuerna hasta la vertical. Esta posición pone la máxima tensión en el estiramiento, donde está el crecimiento. Baja en 4 segundos.',

  { id:'dla06', n:'Elevación lateral sentado con pausa arriba (Rambod)', eq:'Mancuernas + banco', t:['mancuerna','aislado'], r:'12-15',
    tor:'Sentado, sin impulso. Sube las mancuernas hasta la altura del hombro con los codos ligeramente flexionados, pausa 2 segundos arriba con el meñique ligeramente elevado y baja en 3 segundos. Sentado eliminas cualquier trampa con las piernas.',

  { id:'dla08', n:'Elevación lateral unilateral en polea tras glúteo + parciales', eq:'Polea baja', t:['polea','aislado','unilateral'], r:'10 + 10 parciales por lado',
    tor:'Polea en el punto más bajo, cable por detrás del glúteo. Haz 10 repeticiones completas y, al fallar, 10 parciales en la mitad inferior del recorrido, donde el deltoide está estirado. No sueltes el cable entre lados: cambia y sigue.',
    cue:'Cable por detrás = tensión en el estiramiento. Parciales abajo = estímulo extra justo donde más crece.' }

function leer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* Índice plano de ejercicios y protocolos por id */
const INDICE = {};

function hashCorto(txt) {
  let h = 5381;
  for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) >>> 0;
  return h.toString(16).toUpperCase().padStart(8, '0').slice(-6);
}

function elegirPonderado(lista, peso) {
  const ws = lista.map(x => Math.max(0.0001, peso(x)));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < lista.length; i++) { r -= ws[i]; if (r <= 0) return lista[i]; }
  return lista[lista.length - 1];
}

/* =====================================================================
   MOTOR COMBINATORIO ANTI-DUPLICACIÓN
   1) Excluye todos los ejercicios de la sesión inmediata anterior del grupo.
   2) Excluye los pares ejercicio+protocolo de esa sesión.
   3) Rechaza cualquier firma completa (7 ejercicios + 7 protocolos) ya generada.
   4) Pondera por uso histórico: lo que menos has hecho sale con más probabilidad.
   ===================================================================== */
function protocoloApto(p, ej, idx) {
  if (p.id === 'fst7' && idx < 3) return false;               // FST-7 solo como remate
  return !p.apto.length || p.apto.some(t => ej.t.includes(t));
}

function poolSlot(slot) {
  const vistos = new Set(), pool = [];
  slot.b.forEach(b => BANCO[b].forEach(e => { if (!vistos.has(e.id)) { vistos.add(e.id); pool.push(INDICE[e.id]); } }));
  return pool;
}

function candidatosEj(slot, usados, evitar) {
  const pool = poolSlot(slot);
  let c = pool.filter(e => !usados.has(e.id) && !evitar.has(e.id));
  if (!c.length) c = pool.filter(e => !usados.has(e.id));
  return c.length ? c : pool;
}

function candidatosProt(ej, idx, conteo, vecinos, paresPrev) {
  const base = PROTOCOLOS.filter(p => protocoloApto(p, ej, idx));
  let c = base.filter(p => (conteo[p.id] || 0) < 2 && !vecinos.includes(p.id) && !paresPrev.has(ej.id + '|' + p.id));
  if (!c.length) c = base.filter(p => !vecinos.includes(p.id));
  return c.length ? c : base;
}

function distribuirSeries(base) {
  const s = base.slice();
  const meta = 16 + rnd(4);                                    // 16 a 19 series efectivas
  let suma = s.reduce((a, b) => a + b, 0), guardia = 0;
  while (suma < meta && guardia++ < 200) { const i = rnd(s.length); if (s[i] < 4) { s[i]++; suma++; } }
  while (suma > meta && guardia++ < 400) { const i = rnd(s.length); if (s[i] > 2) { s[i]--; suma--; } }
  return s;
}

function firmaDe(items) { return items.map(i => i.ex + ':' + i.pr).join('>'); }

  const tpl = PLANTILLAS[gid];
  const ultimas = leer(LS.ult, {});
  const ult = ultimas[gid] || null;
  const firmasG = new Set((leer(LS.firmas, {}))[gid] || []);
  const uso = leer(LS.uso, {});
  const evitar = new Set(ult ? ult.items.map(i => i.ex) : []);
  if (rotar && ult && ult.antes) ult.antes.forEach(id => evitar.add(id));
  const paresPrev = new Set(ult ? ult.items.map(i => i.ex + '|' + i.pr) : []);

  let elegido = null;
  for (let intento = 0; intento < 150; intento++) {
    const usados = new Set(), conteo = {}, items = [];
    tpl.slots.forEach((slot, idx) => {
      const ej = elegirPonderado(candidatosEj(slot, usados, evitar), e => 1 / (1 + (uso[e.id] || 0)));
      usados.add(ej.id);
      const vecinos = items.length ? [items[items.length - 1].pr] : [];
      const pr = elegirPonderado(candidatosProt(ej, idx, conteo, vecinos, paresPrev), p => 1 / (1 + 0.35 * (uso['p:' + p.id] || 0)));
      conteo[pr.id] = (conteo[pr.id] || 0) + 1;
      items.push({ ex: ej.id, pr: pr.id });
    });
    const firma = firmaDe(items);
    if (!firmasG.has(firma)) { elegido = { items, firma }; break; }
    if (!elegido) elegido = { items, firma };
  }

  const series = distribuirSeries(tpl.slots.map(s => s.s));
  const versiones = leer(LS.ver, {});
  versiones[gid] = (versiones[gid] || 0) + 1;
  guardar(LS.ver, versiones);

  const rutina = {
    id: Date.now().toString(36) + rnd(1e6).toString(36),
    gid, version: versiones[gid], fecha: new Date().toISOString(), firma: elegido.firma,
    items: elegido.items.map((it, i) => ({ ex: it.ex, pr: it.pr, sets: series[i], done: new Array(series[i]).fill(false) })),
    posing: new Array(POSES.length * POSING_RONDAS).fill(false)
  };

  /* Memoria: la sesión anterior "real" se conserva en `antes` para que rotar no la resucite */
  const antes = rotar && ult ? (ult.antes || []) : (ult ? ult.items.map(i => i.ex) : []);
  ultimas[gid] = { items: rutina.items.map(i => ({ ex: i.ex, pr: i.pr })), firma: rutina.firma, antes };
  guardar(LS.ult, ultimas);

  const f = leer(LS.firmas, {});
  f[gid] = (f[gid] || []).concat(rutina.firma).slice(-500);
  guardar(LS.firmas, f);

  rutina.items.forEach(i => { uso[i.ex] = (uso[i.ex] || 0) + 1; uso['p:' + i.pr] = (uso['p:' + i.pr] || 0) + 1; });
  guardar(LS.uso, uso);

  let hist = leer(LS.hist, []);
  if (rotar) {                                                 // la variante descartada sin progreso no ensucia el historial
    const act = leer(LS.act, null);
    if (act && act.gid === gid && progresoDe(act).hechos === 0) hist = hist.filter(h => h.id !== act.id);
  }
  hist.unshift(rutina);
  guardar(LS.hist, hist.slice(0, 150));
  guardar(LS.act, rutina);
  return rutina;
}

/* Cambia un solo ejercicio de la rutina activa sin tocar el resto */
function cambiarEjercicio(rutina, idx) {
  const slot = PLANTILLAS[rutina.gid].slots[idx];
  const ult = (leer(LS.ult, {}))[rutina.gid] || {};
  const usados = new Set(rutina.items.map(i => i.ex));
  const evitar = new Set(ult.antes || []);
  const uso = leer(LS.uso, {});
  const pool = candidatosEj(slot, usados, evitar).filter(e => !usados.has(e.id));
  if (!pool.length) return false;
  const ej = elegirPonderado(pool, e => 1 / (1 + (uso[e.id] || 0)));
  const conteo = {};
  rutina.items.forEach((it, i) => { if (i !== idx) conteo[it.pr] = (conteo[it.pr] || 0) + 1; });
  const vecinos = [rutina.items[idx - 1], rutina.items[idx + 1]].filter(Boolean).map(i => i.pr);
  const pr = elegirPonderado(candidatosProt(ej, idx, conteo, vecinos, new Set()), p => 1 / (1 + 0.35 * (uso['p:' + p.id] || 0)));
  const item = rutina.items[idx];
  item.ex = ej.id; item.pr = pr.id; item.done = new Array(item.sets).fill(false);
  rutina.firma = firmaDe(rutina.items);
  uso[ej.id] = (uso[ej.id] || 0) + 1; uso['p:' + pr.id] = (uso['p:' + pr.id] || 0) + 1;
  guardar(LS.uso, uso);
  const ultimas = leer(LS.ult, {});
  if (ultimas[rutina.gid]) { ultimas[rutina.gid].items = rutina.items.map(i => ({ ex: i.ex, pr: i.pr })); ultimas[rutina.gid].firma = rutina.firma; guardar(LS.ult, ultimas); }
  const f = leer(LS.firmas, {}); f[rutina.gid] = (f[rutina.gid] || []).concat(rutina.firma).slice(-500); guardar(LS.firmas, f);
  return true;
}

/* Borra la memoria anti-repetición del grupo (no toca historial ni contador de versiones) */
function reiniciarPool(gid) {
  const ultimas = leer(LS.ult, {}); delete ultimas[gid]; guardar(LS.ult, ultimas);
  const f = leer(LS.firmas, {}); delete f[gid]; guardar(LS.firmas, f);
  const uso = leer(LS.uso, {});
  PLANTILLAS[gid].slots.forEach(s => poolSlot(s).forEach(e => { delete uso[e.id]; }));
  guardar(LS.uso, uso);
}

function progresoDe(r) {
  let total = 0, hechos = 0;
  r.items.forEach(i => { total += i.done.length; hechos += i.done.filter(Boolean).length; });
  const pt = r.posing.length, ph = r.posing.filter(Boolean).length;
  return { total, hechos, pt, ph, pct: Math.round(100 * (hechos + ph) / Math.max(1, total + pt)) };
}

function cargaTxt(ej, prId) {
  if (!ej.ref) return '';
  const f = FACTOR_CARGA[prId] || 1, base = MARCAS[ej.ref.b];
  const lo = Math.round(base * ej.ref.p[0] * f / 5) * 5, hi = Math.round(base * ej.ref.p[1] * f / 5) * 5;
  const nombre = { hack:'Hack Squat de 160 kg', pendulo:'Péndulo de 100 kg', pm:'Peso Muerto de 140 kg' }[ej.ref.b];
  return lo + '–' + hi + ' kg en discos (≈' + (lo / 2) + '–' + (hi / 2) + ' kg por lado) · calculado sobre tu ' + nombre + (f < 1 ? ', ajustado al protocolo' : '');
}

const GOTEOS = [

function goteo(color, variante, clase) {
  const V = GOTEOS[variante || 0], B = 14, W = 400, r = 7;

  V.slice().sort((a, b) => b[0] - a[0]).forEach(([x, w, len]) => {
    const h = w / 2, xr = x + h, xl = x - h, yb = B + len - h;
    d += 'L' + (xr + r) + ' ' + B + 'Q' + xr + ' ' + B + ' ' + xr + ' ' + (B + r) + 'V' + yb +
         'A' + h + ' ' + h + ' 0 0 1 ' + xl + ' ' + yb + 'V' + (B + r) + 'Q' + xl + ' ' + B + ' ' + (xl - r) + ' ' + B;
  });
  d += 'L0 ' + B + 'Z';
  const gotas = V.filter((_, i) => i % 2 === 0).map(([x, w, len]) => '<circle cx="' + x + '" cy="' + (B + len + 10) + '" r="' + Math.max(3, w / 4) + '"/>').join('');
  return '<svg class="goteo ' + (clase || '') + '" viewBox="0 0 400 80" aria-hidden="true" fill="' + color + '"><path d="' + d + '"/>' + gotas + '</svg>';

/* =====================================================================
   CRONÓMETRO (hoja inferior + píldora flotante + alarma)
   ===================================================================== */
const T = { fin: 0, total: 1, restante: 0, corriendo: false, pausado: false, etq: '', iv: null, ultimoSeg: -1 };
let wakeLock = null;
async function pedirWakeLock() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function fmt(ms) { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function restanteMs() { return !T.corriendo ? 0 : T.pausado ? T.restante : Math.max(0, T.fin - Date.now()); }

function iniciarTimer(seg, etq) {
  desbloquearAudio(); pedirWakeLock();
  T.total = seg * 1000; T.fin = Date.now() + T.total; T.corriendo = true; T.pausado = false; T.etq = etq || (seg + ' s'); T.ultimoSeg = -1;
  clearInterval(T.iv); T.iv = setInterval(tick, 200); tick();
  if (vista === 'entreno') actualizarAccion();
}
function tick() {
  if (!T.corriendo) return;
  const rest = restanteMs(), s = Math.ceil(rest / 1000);
  if (!T.pausado && s !== T.ultimoSeg && s <= 3 && s > 0) { pitido(880, 0.12); vibrar(60); }
  T.ultimoSeg = s;
  actualizarRelojUI();
  if (!T.pausado && rest <= 0) terminarTimer();
}
function terminarTimer() {
  clearInterval(T.iv); T.corriendo = false; actualizarRelojUI();
  if (vista === 'entreno') actualizarAccion();
  vibrar([300, 120, 300, 120, 600]);
  pitido(660, 0.25, 0.2); setTimeout(() => pitido(990, 0.25, 0.2), 280); setTimeout(() => pitido(1320, 0.45, 0.22), 560);
  const suelta = /isom|estir|vac|pose|front|side|rear|abdominal|muro|negativa|fascia|pausa/i.test(T.etq);
  const c = $('#capaAlarma');
  c.innerHTML = goteo('#ffb27f', 2) + '<p class="mini" style="color:#d6d3ea">' + esc(T.etq) + ' · terminado</p>' +
    '<p class="gran">' + (suelta ? '¡SUELTA!' : '¡YA!') + '</p>' +
    '<p style="font-size:19px;font-weight:800">' + (suelta ? 'Respira. Buen trabajo.' : 'Vuelve a la máquina.') + '</p>' +
    '<button class="btn btn-durazno" style="min-width:210px;min-height:66px;font-size:21px" data-acc="cerrarAlarma">OK</button>';
  c.hidden = false; c.querySelector('button').focus();
}
function pararTimer() { clearInterval(T.iv); T.corriendo = false; T.pausado = false; actualizarRelojUI(); if (vista === 'entreno') actualizarAccion(); }
function actualizarRelojUI() {
  const activo = T.corriendo, rest = restanteMs(), hojaAbierta = !$('#capaReloj').hidden;
  const enBarra = !$('#accion').hidden;
  $('#pildora').hidden = !activo || hojaAbierta || enBarra;
  const accTxt = $('#accTxt');
  if (accTxt) { accTxt.textContent = fmt(rest); $('#accEtq').textContent = T.pausado ? 'En pausa' : 'Tiempo'; }
  $('#tabReloj').classList.toggle('corriendo', activo && !T.pausado);
  if (activo) { $('#pildoraTxt').textContent = fmt(rest); $('#pildoraEtq').textContent = T.pausado ? 'En pausa' : T.etq; }
  const num = $('#relNum');
  if (!num) return;
  num.textContent = fmt(rest);
  $('#relEtq').textContent = activo ? (T.pausado ? 'En pausa · ' : '') + T.etq : 'Elige un tiempo abajo';
  $('#anilloArco').style.strokeDashoffset = activo ? 326.73 * (1 - rest / T.total) : 326.73;
  $('#relPausa').innerHTML = T.pausado ? ico('play') + 'Seguir' : ico('pausa') + 'Pausa';
  $('#relPausa').disabled = !activo;
}
function abrirReloj() {
  const c = $('#capaReloj');
  const etqT = s => s < 60 ? s + ' s' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  c.innerHTML = '<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="relT"><div class="asa"></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><h2 id="relT" class="disp" style="font-size:22px">Cronómetro</h2>' +

    '<div class="anillo"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ece9f6" stroke-width="12"/>' +
    '<circle id="anilloArco" cx="60" cy="60" r="52" fill="none" stroke="#ffb27f" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73"/></svg>' +
    '<div class="num"><div><b id="relNum">00:00</b><p id="relEtq" class="mini suave" style="margin-top:8px;max-width:170px">Elige un tiempo abajo</p></div></div></div>' +

function rutinaComoTexto(r) {
  const l = ['TORTURA BIOMECÁNICA · ' + GRUPOS_UI[r.gid].c.toUpperCase(), 'Versión #' + r.version + ' · ' + new Date(r.fecha).toLocaleDateString('es-MX'), ''];

    l.push('   Técnica: ' + p.n);
  });
  l.push('', 'POSING: ' + POSES.map(p => p.n).join(' · ') + ' (' + POSING_RONDAS + ' vueltas × 20 s)', 'VACÍOS: 5 × 25 s en ayunas');
  return l.join('\n');
}

async function crearRutina() {
  if (actual && actual.paso !== 8) {
    const pr = progresoDe(actual);
    if (pr.hechos > 0 && pr.pct < 100) {
      const ok = await preguntar('Tienes una rutina a medias', 'Llevas ' + pr.hechos + ' de ' + pr.total + ' series de ' + GRUPOS_UI[actual.gid].c + '. Se queda guardada en tu historial.', 'Crear una nueva', 'Seguir con la mía');
      if (!ok) { ir('entreno'); return; }
    }
  }
  desbloquearAudio();
  actual = generarRutina(grupoSel, false);
  actual.paso = 0; guardarActual(actual);
  guardar(LS.grupo, grupoSel);
  vibrar([30, 40, 80]);
  ir('entreno');
  aviso('Rutina nueva lista · Versión #' + actual.version);
}

async function accion(b) {
  const a = b.dataset.acc;
  switch (a) {
    case 'grupo':
      grupoSel = b.dataset.g; guardar(LS.grupo, grupoSel); vibrar(15); renderInicio(); break;
    case 'crear':
      crearRutina(); break;
    case 'vac': {
      const v = leer(LS.vac, {}), k = claveDia(new Date()), hoy = v[k] || [false, false, false, false, false], i = +b.dataset.i;
      hoy[i] = !hoy[i];
      const limpio = {}; limpio[k] = hoy; guardar(LS.vac, limpio);
      if (hoy[i]) iniciarTimer(25, 'Vacío abdominal ' + (i + 1) + ' de 5');
      renderInicio(); break;
    }
    case 'serie': {
      const i = +b.dataset.i, j = +b.dataset.j, it = actual.items[i];
      it.done[j] = !it.done[j]; guardarActual(actual);
      if (it.done[j]) {
        vibrar(40);
        const todo = it.done.every(Boolean);
        if (AJ.descanso) iniciarTimer(descansoDe(i), todo ? 'Descanso, luego Siguiente' : 'Descanso');
        if (todo) aviso('¡Ejercicio ' + (i + 1) + ' terminado!');
      }
      repintarEntreno(); break;
    }
    case 'pose': {
      const n = +b.dataset.n;
      actual.posing[n] = !actual.posing[n]; guardarActual(actual);
      if (actual.posing[n]) iniciarTimer(20, POSES[Math.floor(n / POSING_RONDAS)].n);
      repintarEntreno(); break;
    }
    case 'irPaso':
      actual.paso = +b.dataset.p; guardarActual(actual); renderEntreno(); actualizarAccion(); window.scrollTo(0, 0); break;
    case 'ant':
      if (actual.paso > 0) { actual.paso--; guardarActual(actual); renderEntreno(); actualizarAccion(); window.scrollTo(0, 0); }
      break;
    case 'sig':
      if (actual.paso < 7) { actual.paso++; }
      else {
        const pr = progresoDe(actual);
        if (pr.pct < 100) {
          const ok = await preguntar('¿Terminar ya?', 'Te faltan ' + (pr.total - pr.hechos) + ' series y ' + (pr.pt - pr.ph) + ' poses. Puedes terminar igual.', 'Sí, terminar', 'Seguir entrenando');
          if (!ok) return;
        }
        actual.paso = 8; vibrar([60, 60, 200]);
      }
      guardarActual(actual); renderEntreno(); actualizarAccion(); window.scrollTo(0, 0); break;
    case 'cambiar': {
      const i = +b.dataset.i;
      if (actual.items[i].done.some(Boolean)) {
        const ok = await preguntar('¿Cambiar este ejercicio?', 'Ya marcaste series en él. Se borran y te doy otro del mismo tipo.', 'Sí, cambiar', 'No');
        if (!ok) return;
      }
      if (cambiarEjercicio(actual, i)) { guardarActual(actual); renderEntreno(); actualizarAccion(); aviso('Ejercicio cambiado'); }
      else aviso('No hay más opciones para este ejercicio');
      break;
    }
    case 'otra': {
      const ok = await preguntar('¿Quieres otra rutina?', 'Te doy otra versión distinta de ' + GRUPOS_UI[actual.gid].c + '. Lo que marcaste en esta se pierde.', 'Sí, dame otra', 'No, me quedo con esta');
      if (!ok) return;
      actual = generarRutina(actual.gid, true); actual.paso = 0; guardarActual(actual);
      renderEntreno(); actualizarAccion(); window.scrollTo(0, 0); aviso('Nueva versión #' + actual.version); break;
    }
    case 'abrirReloj': abrirReloj(); break;
    case 'cerrarReloj': cerrarReloj(); break;
    case 'tPausa':
      if (!T.corriendo) return;
      if (!T.pausado) { T.restante = T.fin - Date.now(); T.pausado = true; }
      else { T.fin = Date.now() + T.restante; T.pausado = false; }
      actualizarRelojUI(); break;
    case 'tMas':
      if (!T.corriendo) { iniciarTimer(10, '10 s'); return; }
      if (T.pausado) T.restante += 10000; else T.fin += 10000;
      T.total += 10000; tick(); break;
    case 'tMenos':
      if (!T.corriendo) return;
      if (T.pausado) T.restante = Math.max(1000, T.restante - 10000); else T.fin = Math.max(Date.now() + 1000, T.fin - 10000);
      tick(); break;
    case 'tParar': pararTimer(); break;
    case 'cerrarAlarma': $('#capaAlarma').hidden = true; $('#capaAlarma').innerHTML = ''; break;
    case 'hModo': H.modo = b.dataset.m; renderHistorial(); break;
    case 'hMes': H.mes = new Date(H.mes.getFullYear(), H.mes.getMonth() + Number(b.dataset.d), 1); H.dia = null; renderHistorial(); break;
    case 'hDia': H.dia = H.dia === b.dataset.k ? null : b.dataset.k; renderHistorial(); break;
    case 'hCargar': {
      const h = leer(LS.hist, []).find(x => x.id === b.dataset.id);
      if (!h) return;
      actual = h; actual.paso = primerPendiente(h); guardarActual(actual);
      grupoSel = h.gid; guardar(LS.grupo, grupoSel);
      ir('entreno'); aviso('Rutina retomada'); break;
    }
    case 'pMas': case 'pMenos': {
      const inp = $('#inPeso'), v = parseFloat(inp.value) || pesoActual();
      inp.value = fmtKg(Math.min(130, Math.max(60, v + (a === 'pMas' ? 0.1 : -0.1)))); break;
    }
    case 'pGuardar': {
      const v = parseFloat($('#inPeso').value);
      if (!(v >= 60 && v <= 130)) { aviso('Escribe un peso entre 60 y 130 kg'); return; }
      guardar(LS.peso, Math.round(v * 10) / 10); renderPerfil(); aviso('Peso guardado: ' + fmtKg(v) + ' kg'); break;
    }
    case 'ajuste':
      AJ[b.dataset.k] = !AJ[b.dataset.k]; guardar(LS.ajustes, AJ); b.setAttribute('aria-checked', AJ[b.dataset.k]); vibrar(15); break;
    case 'copiar': {
      if (!actual) { aviso('Primero crea una rutina'); return; }
      const txt = rutinaComoTexto(actual);
      try { await navigator.clipboard.writeText(txt); aviso('Rutina copiada'); } catch (e) { prompt('Copia tu rutina:', txt); }
      break;
    }
    case 'exportar': {
      const datos = { app: 'Tortura Biomecánica', exportado: new Date().toISOString(),
        atleta: { estatura_m: 1.83, peso_kg: pesoActual(), grasa_inicial: 0.22, meta: '80-82 kg al 10-12%', marcas_kg: MARCAS },
        historial: leer(LS.hist, []).map(h => Object.assign({}, h, {
          grupo: PLANTILLAS[h.gid] ? PLANTILLAS[h.gid].nombre : h.gid,
          detalle: h.items.map(it => ({ ejercicio: INDICE[it.ex] ? INDICE[it.ex].n : it.ex, protocolo: PROT[it.pr] ? PROT[it.pr].n : it.pr, series: it.sets, completadas: it.done.filter(Boolean).length }))
        })) };
      const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
      const el = document.createElement('a');
      el.href = URL.createObjectURL(blob); el.download = 'tortura-biomecanica-' + claveDia(new Date()) + '.json';
      document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(el.href), 1000);
      aviso('Copia descargada'); break;
    }
    case 'tutorial': mostrarIntro(0); break;
    case 'reiniciar': {
      const ok = await preguntar('¿Olvidar rutinas de ' + GRUPOS_UI[grupoSel].c + '?', 'La app vuelve a poder usar todos los ejercicios de ese grupo. Tu historial no se borra.', 'Sí, olvidar', 'No');
      if (ok) { reiniciarPool(grupoSel); aviso('Listo, memoria reiniciada'); }
      break;
    }
    case 'borrar': {
      const ok = await preguntar('¿Borrar TODO?', 'Se borran tu historial, las versiones y la memoria de rutinas. No se puede deshacer.', 'Sí, borrar todo', 'No, cancelar', true);
      if (!ok) return;
      [LS.hist, LS.ult, LS.ver, LS.firmas, LS.uso, LS.act].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
      actual = null; renderPerfil(); aviso('Todo borrado'); break;
    }
    case 'introSig': if (introPaso < INTRO.length - 1) mostrarIntro(introPaso + 1); else cerrarIntro(); break;
    case 'introFin': cerrarIntro(); break;
  }
}

document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.id === 'capaReloj') { cerrarReloj(); return; }
  const tim = t.closest('[data-timer]');
  if (tim) { iniciarTimer(Number(tim.dataset.timer), tim.dataset.etq); return; }
  const irB = t.closest('[data-ir]');
  if (irB) { ir(irB.dataset.ir); return; }
  const b = t.closest('[data-acc]');
  if (b && !b.disabled) accion(b);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#capaAlarma').hidden) { $('#capaAlarma').hidden = true; return; }
  if (!$('#capaReloj').hidden) cerrarReloj();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T.corriendo) { pedirWakeLock(); tick(); } });

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(function init() {
  ir(actual && actual.paso !== 8 && progresoDe(actual).hechos > 0 ? 'entreno' : 'inicio', true);
  if (!leer(LS.intro, false)) mostrarIntro(0);
})();
</script>
</body>
